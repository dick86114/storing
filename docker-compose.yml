version: '3.8'

services:
  storing:
    image: dick86114/storing:latest
    container_name: storing
    restart: unless-stopped
    ports:
      - "1050:1050"  # 前端
      - "1052:1052"  # API
    env_file:
      - .env
    environment:
      # 运行时配置
      - NODE_ENV=production
    volumes:
      # 可选：持久化日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1052/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

