<body class="bg-[#030f09] min-h-screen flex items-center justify-center font-sans">

<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style type="text/tailwindcss">
@theme {
  --color-primary: #0D2B1E;
  --color-primary-light: #143D2B;
  --color-primary-dark: #071A12;
  --color-accent: #C9A84C;
  --color-accent-dim: #A8893E;
  --color-surface: #0A1F15;
  --color-surface-elevated: #112A1F;
  --color-surface-card: #0E2419;
  --color-card-hover: #162F23;
  --color-text-primary: #E8E4DC;
  --color-text-secondary: #9CA89F;
  --color-text-muted: #6B7A6F;
  --color-border: #1C3A2B;
  --color-border-subtle: #162E22;
  --color-success: #2ECC71;
  --color-danger: #E74C3C;
}
</style>

<!-- Phone Frame -->
<div class="w-[390px] h-[844px] bg-primary-dark rounded-[40px] shadow-2xl shadow-black/60 border border-border overflow-hidden relative flex flex-col">
  
  <!-- Android Status Bar -->
  <div class="h-6 bg-primary-dark flex items-center justify-between px-6 shrink-0">
    <span class="text-text-secondary text-[11px] font-medium" style="font-family:'Noto Sans SC'">9:41</span>
    <div class="flex items-center gap-1.5">
      <i data-lucide="signal" class="w-3 h-3 text-text-secondary"></i>
      <i data-lucide="wifi" class="w-3 h-3 text-text-secondary"></i>
      <i data-lucide="battery" class="w-3.5 h-3.5 text-text-secondary"></i>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col relative">

    <!-- Top Area (~35% of screen) -->
    <div class="flex flex-col items-center justify-center pt-16 pb-8">
      <!-- Logo -->
      <div class="w-14 h-14 bg-accent/15 border border-accent/30 rounded-2xl flex items-center justify-center">
        <i data-lucide="circle-dot" class="w-7 h-7 text-accent"></i>
      </div>
      <!-- App Name -->
      <h1 class="text-2xl font-bold text-text-primary mt-4" style="font-family:'Noto Serif SC'">乾坤戒</h1>
      <!-- English Name -->
      <span class="text-xs text-text-muted uppercase tracking-widest mt-1">Storing</span>
      <!-- Tagline -->
      <p class="text-sm text-text-secondary mt-2" style="font-family:'Noto Sans SC'">你的个人知识收藏空间</p>
    </div>

    <!-- Form Card -->
    <div class="mx-5 bg-surface-card rounded-2xl p-6 border border-border-subtle">
      <!-- Title -->
      <h2 class="text-base font-medium text-text-primary mb-5" style="font-family:'Noto Sans SC'">登录账号</h2>

      <!-- Username Field -->
      <div>
        <label class="text-xs text-text-muted mb-1 block" style="font-family:'Noto Sans SC'">用户名</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-text-muted absolute left-4 top-1/2 -translate-y-1/2"></i>
          <input type="text" placeholder="请输入用户名" class="w-full h-12 bg-surface border border-border rounded-xl pl-10 pr-4 text-sm text-text-primary placeholder-text-muted focus:outline-none focus:border-accent/50 transition-colors" style="font-family:'Noto Sans SC'" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="mt-4">
        <label class="text-xs text-text-muted mb-1 block" style="font-family:'Noto Sans SC'">密码</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-text-muted absolute left-4 top-1/2 -translate-y-1/2"></i>
          <input type="password" placeholder="请输入密码" class="w-full h-12 bg-surface border border-border rounded-xl pl-10 pr-10 text-sm text-text-primary placeholder-text-muted focus:outline-none focus:border-accent/50 transition-colors" style="font-family:'Noto Sans SC'" />
          <i data-lucide="eye-off" class="w-4 h-4 text-text-muted absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer hover:text-text-secondary transition-colors"></i>
        </div>
      </div>

      <!-- Error State -->
      <div class="mt-4 bg-danger/10 border border-danger/30 rounded-lg px-3 py-2 flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-danger shrink-0"></i>
        <span class="text-xs text-danger" style="font-family:'Noto Sans SC'">用户名或密码错误</span>
      </div>

      <!-- Login Button -->
      <button class="w-full h-[52px] bg-accent rounded-xl text-white font-medium text-base mt-6 hover:bg-accent-dim transition-colors" style="font-family:'Noto Sans SC'">
        登录
      </button>

      <!-- Help Text -->
      <p class="text-xs text-text-muted text-center mt-3" style="font-family:'Noto Sans SC'">账号由管理员创建，如需帮助请联系管理员</p>
    </div>

    <!-- Version Number -->
    <span class="text-xs text-text-muted text-center absolute bottom-8 left-1/2 -translate-x-1/2" style="font-family:'Noto Sans SC'">v1.2.3</span>

  </div>

</div>

<!-- Page Navigation -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-surface-elevated/90 backdrop-blur rounded-full px-5 py-2.5 border border-border/50 z-50">
  <a href="mobile-logout-dialog.html" class="text-accent text-xs font-medium hover:underline">退出弹窗 →</a>
  <span class="text-border">|</span>
  <a href="mobile-inbox.html" class="text-text-muted text-xs hover:text-text-secondary">收件箱</a>
</div>

</body>
