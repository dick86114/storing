<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
</head>

<body class="bg-[#030f09] min-h-screen flex items-center justify-center font-sans">
<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style type="text/tailwindcss">
@theme {
  --color-primary: #0D2B1E;
  --color-primary-light: #143D2B;
  --color-primary-dark: #071A12;
  --color-accent: #C9A84C;
  --color-accent-dim: #A8893E;
  --color-surface: #0A1F15;
  --color-surface-elevated: #112A1F;
  --color-surface-card: #0E2419;
  --color-text-primary: #E8E4DC;
  --color-text-secondary: #9CA89F;
  --color-text-muted: #6B7A6F;
  --color-border: #1C3A2B;
  --color-tag-blue: #2A4A6B;
  --color-tag-purple: #4A2D6B;
  --color-tag-teal: #1A4A4A;
  --color-tag-amber: #4A3A1A;
  --color-success: #2ECC71;
  --color-danger: #E74C3C;
}

@keyframes progress-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.progress-animate {
  animation: progress-slide 1.5s ease-in-out infinite;
}
</style>

<!-- Phone Frame -->
<div class="w-[390px] h-[844px] bg-primary-dark rounded-[40px] shadow-2xl shadow-black/60 border border-border overflow-hidden relative flex flex-col">
  
  <!-- Android Status Bar -->
  <div class="h-6 bg-primary-dark flex items-center justify-between px-6 shrink-0">
    <span class="text-text-secondary text-[11px] font-medium" style="font-family:'Noto Sans SC'">9:41</span>
    <div class="flex items-center gap-1.5">
      <i data-lucide="signal" class="w-3 h-3 text-text-secondary"></i>
      <i data-lucide="wifi" class="w-3 h-3 text-text-secondary"></i>
      <i data-lucide="battery" class="w-3.5 h-3.5 text-text-secondary"></i>
    </div>
  </div>

  <!-- App Bar -->
  <div class="h-14 bg-primary-dark/90 backdrop-blur-md flex items-center justify-between px-4 shrink-0 border-b border-border/50">
    <div class="flex items-center gap-3">
      <a href="mobile-inbox.html" class="w-10 h-10 flex items-center justify-center -ml-2">
        <i data-lucide="x" class="w-5 h-5 text-text-primary"></i>
      </a>
      <h1 class="text-text-primary text-lg font-bold" style="font-family:'Noto Serif SC'">采集网页</h1>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto px-5 pt-6 pb-8">
    
    <!-- Input Section -->
    <div class="mb-6">
      <div class="relative">
        <div class="w-full bg-surface-elevated border border-border rounded-xl px-4 py-4 flex items-center gap-3">
          <i data-lucide="link" class="w-5 h-5 text-text-muted shrink-0"></i>
          <span class="text-text-muted text-[15px]" style="font-family:'Noto Sans SC'">粘贴网页链接</span>
        </div>
        <!-- Clipboard Detection Banner -->
        <div class="absolute -bottom-11 left-0 right-0 bg-accent/10 border border-accent/20 rounded-lg px-3 py-2 flex items-center gap-2">
          <i data-lucide="clipboard" class="w-3.5 h-3.5 text-accent"></i>
          <span class="text-accent text-[12px] flex-1">检测到剪贴板链接</span>
          <span class="text-accent text-[12px] font-semibold">粘贴</span>
        </div>
      </div>
    </div>

    <!-- Spacer for clipboard banner -->
    <div class="h-8"></div>

    <!-- Submit Button -->
    <button class="w-full h-12 bg-accent rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-accent/20 mb-4">
      <i data-lucide="download" class="w-5 h-5 text-primary-dark"></i>
      <span class="text-primary-dark text-[15px] font-bold" style="font-family:'Noto Sans SC'">开始采集</span>
    </button>

    <!-- Supported types -->
    <div class="flex items-center justify-center gap-4 mb-8">
      <div class="flex items-center gap-1.5">
        <i data-lucide="globe" class="w-3.5 h-3.5 text-text-muted"></i>
        <span class="text-text-muted text-[12px]">普通网页</span>
      </div>
      <div class="w-px h-3 bg-border"></div>
      <div class="flex items-center gap-1.5">
        <i class="fa-brands fa-weixin text-text-muted text-[12px]"></i>
        <span class="text-text-muted text-[12px]">微信公众号</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="flex items-center gap-3 mb-5">
      <div class="flex-1 h-px bg-border/60"></div>
      <span class="text-text-muted text-[11px] font-medium tracking-wider">近期任务</span>
      <div class="flex-1 h-px bg-border/60"></div>
    </div>

    <!-- Task List -->
    <!-- Task: In Progress -->
    <div class="bg-surface-elevated border border-border/60 rounded-xl p-4 mb-3">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent/10 flex items-center justify-center shrink-0 mt-0.5">
          <i data-lucide="loader" class="w-4 h-4 text-accent"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-text-primary text-[13px] font-medium line-clamp-1 mb-1.5" style="font-family:'Noto Sans SC'">Anthropic 发布 Claude 模型规范 2.0</h4>
          <div class="w-full h-1.5 bg-primary rounded-full overflow-hidden mb-1.5">
            <div class="h-full w-[60%] bg-accent/70 rounded-full relative overflow-hidden">
              <div class="absolute inset-0 bg-accent/40 progress-animate"></div>
            </div>
          </div>
          <span class="text-accent-dim text-[11px]">正在解析正文…</span>
        </div>
      </div>
    </div>

    <!-- Task: In Progress 2 -->
    <div class="bg-surface-elevated border border-border/60 rounded-xl p-4 mb-3">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent/10 flex items-center justify-center shrink-0 mt-0.5">
          <i data-lucide="loader" class="w-4 h-4 text-accent"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-text-primary text-[13px] font-medium line-clamp-1 mb-1.5" style="font-family:'Noto Sans SC'">深度学习编译器：从 TVM 到 MLIR 的演进</h4>
          <div class="w-full h-1.5 bg-primary rounded-full overflow-hidden mb-1.5">
            <div class="h-full w-[30%] bg-accent/70 rounded-full relative overflow-hidden">
              <div class="absolute inset-0 bg-accent/40 progress-animate"></div>
            </div>
          </div>
          <span class="text-accent-dim text-[11px]">正在生成 AI 摘要…</span>
        </div>
      </div>
    </div>

    <!-- Task: Completed -->
    <div class="bg-surface-elevated border border-border/60 rounded-xl p-4 mb-3">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-success/10 flex items-center justify-center shrink-0 mt-0.5">
          <i data-lucide="check-circle" class="w-4 h-4 text-success"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-text-primary text-[13px] font-medium line-clamp-1 mb-1.5" style="font-family:'Noto Sans SC'">为什么说 RAG 是当前企业 AI 应用的最佳实践路径</h4>
          <div class="flex items-center gap-2">
            <span class="text-success text-[11px] font-medium">已完成</span>
            <span class="text-text-muted text-[11px]">·</span>
            <span class="text-text-muted text-[11px]">3 分钟前</span>
          </div>
        </div>
        <button class="h-7 px-3 bg-primary-light border border-border rounded-lg flex items-center shrink-0">
          <span class="text-text-secondary text-[11px] font-medium">打开</span>
        </button>
      </div>
    </div>

    <!-- Task: Failed -->
    <div class="bg-surface-elevated border border-danger/20 rounded-xl p-4 mb-3">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-danger/10 flex items-center justify-center shrink-0 mt-0.5">
          <i data-lucide="alert-circle" class="w-4 h-4 text-danger"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-text-primary text-[13px] font-medium line-clamp-1 mb-1.5" style="font-family:'Noto Sans SC'">mp.weixin.qq.com/s/Xk9...</h4>
          <div class="flex items-center gap-2">
            <span class="text-danger text-[11px] font-medium">采集失败</span>
            <span class="text-text-muted text-[11px]">·</span>
            <span class="text-text-muted text-[11px]">页面已过期</span>
          </div>
        </div>
        <button class="h-7 px-3 bg-danger/10 border border-danger/30 rounded-lg flex items-center shrink-0">
          <span class="text-danger text-[11px] font-medium">重试</span>
        </button>
      </div>
    </div>

  </div>

</div>

<!-- Page Navigation -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-surface-elevated/90 backdrop-blur rounded-full px-5 py-2.5 border border-border/50 z-50">
  <a href="mobile-article.html" class="text-accent text-xs font-medium hover:underline">← 上一页</a>
  <span class="text-text-muted text-xs">3/6</span>
  <a href="mobile-share.html" class="text-accent text-xs font-medium hover:underline">下一页 →</a>
</div>

</body>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
