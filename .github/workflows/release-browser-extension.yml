name: Release browser extension

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "浏览器插件更新说明，可输入多行"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: browser-extension-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish browser extension
    runs-on: ubuntu-latest
    steps:
      - name: Require master as selected workflow branch
        if: ${{ github.ref_name != 'master' }}
        run: |
          echo "请从 master 分支运行 Release browser extension；当前分支为 ${{ github.ref_name }}。" >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve next extension version from release tags
        id: version
        run: |
          LATEST_TAG="$(git tag -l 'browser-extension-v*' --sort=-v:refname | head -n 1)"
          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION="${LATEST_TAG#browser-extension-v}"
          else
            BASE_VERSION="$(node -p "require('./apps/browser-extension/package.json').version")"
          fi
          NEXT_VERSION="$(node scripts/release/client-release-version.mjs bump-patch-version --version "$BASE_VERSION")"
          node scripts/release/client-release-version.mjs set-extension-version --package-path apps/browser-extension/package.json --version "$NEXT_VERSION" >/dev/null
          {
            echo "base=${BASE_VERSION}"
            echo "next=${NEXT_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an existing browser extension release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          TAG="browser-extension-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在。" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Test, type-check and package extension
        run: |
          pnpm --filter browser-extension test
          pnpm --filter browser-extension lint
          pnpm --filter browser-extension package
      - name: Verify packaged manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          SOURCE="releases/browser-extension/storing-browser-extension-v${VERSION}.zip"
          test -f "$SOURCE"
          OBSERVED="$(unzip -p "$SOURCE" manifest.json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => console.log(JSON.parse(s).version));')"
          [[ "$OBSERVED" == "$VERSION" ]] || { echo "ZIP manifest 版本为 $OBSERVED，预期为 $VERSION。" >&2; exit 1; }
          sha256sum "$SOURCE" > "$SOURCE.sha256"
      - name: Create browser extension release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="browser-extension-v${VERSION}"
          SOURCE="releases/browser-extension/storing-browser-extension-v${VERSION}.zip"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$SOURCE" "$SOURCE.sha256" --target "$GITHUB_SHA" --title "Storing Browser Extension v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "## 浏览器插件已发布"
            echo ""
            echo "- 版本：\`${VERSION}\`"
            echo "- 标签：\`${TAG}\`"
            echo "- 发布产物使用工作流临时版本；master 未写入版本提交。"
          } >> "$GITHUB_STEP_SUMMARY"
