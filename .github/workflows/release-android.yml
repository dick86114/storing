name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Android GitHub Release 标签，例如 v2.1.0"
        required: true
        type: string
      release_title:
        description: "Release 标题"
        required: true
        type: string
      release_notes:
        description: "更新说明，可输入多行"
        required: true
        type: string
      android_version_name:
        description: "Android versionName，例如 2.1.0"
        required: true
        type: string
      android_version_code:
        description: "Android 递增 versionCode，例如 204"
        required: true
        type: string
      minimum_supported_version_code:
        description: "Android 最低可继续使用 versionCode，例如 203"
        required: true
        type: string
      mandatory:
        description: "Android 是否强制更新"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Android release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_NAME: ${{ inputs.android_version_name }}
          VERSION_CODE: ${{ inputs.android_version_code }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ inputs.minimum_supported_version_code }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Release 标签必须是 vX.Y.Z，例如 v2.1.0。" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Android versionName 必须是 X.Y.Z，例如 2.1.0。" >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Android versionCode 必须是正整数。" >&2; exit 1; }
          [[ "$MINIMUM_SUPPORTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Android 最低可继续使用 versionCode 必须是正整数。" >&2; exit 1; }
          (( MINIMUM_SUPPORTED_VERSION_CODE <= VERSION_CODE )) || { echo "最低可继续使用 versionCode 不能大于本次 versionCode。" >&2; exit 1; }

  build:
    name: Build signed Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore signing key and build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.QIANKUNJIE_RELEASE_KEYSTORE_BASE64 }}
          QIANKUNJIE_RELEASE_STORE_PASSWORD: ${{ secrets.QIANKUNJIE_RELEASE_STORE_PASSWORD }}
          QIANKUNJIE_RELEASE_KEY_ALIAS: ${{ secrets.QIANKUNJIE_RELEASE_KEY_ALIAS }}
          QIANKUNJIE_RELEASE_KEY_PASSWORD: ${{ secrets.QIANKUNJIE_RELEASE_KEY_PASSWORD }}
          QIANKUNJIE_VERSION_NAME: ${{ inputs.android_version_name }}
          QIANKUNJIE_VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$QIANKUNJIE_RELEASE_STORE_PASSWORD" && test -n "$QIANKUNJIE_RELEASE_KEY_ALIAS" && test -n "$QIANKUNJIE_RELEASE_KEY_PASSWORD" || { echo "缺少 Android 签名 Secret。" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qiankunjie-release.jks"
          export QIANKUNJIE_RELEASE_STORE_FILE="$RUNNER_TEMP/qiankunjie-release.jks"
          pnpm android:assembleRelease
      - name: Prepare Android release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_NAME: ${{ inputs.android_version_name }}
          VERSION_CODE: ${{ inputs.android_version_code }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ inputs.minimum_supported_version_code }}
          MANDATORY: ${{ inputs.mandatory }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          SOURCE="apps/android/app/build/outputs/apk/release/乾坤戒-v${VERSION_NAME}-release.apk"
          ASSET_DIR="$RUNNER_TEMP/android-release-assets"
          APK="$ASSET_DIR/Qiankunjie-v${VERSION_NAME}-universal-release.apk"
          mkdir -p "$ASSET_DIR"
          test -f "$SOURCE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$SOURCE"
          cp "$SOURCE" "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "$APK")"
          export VERSION_NAME VERSION_CODE MINIMUM_SUPPORTED_VERSION_CODE MANDATORY RELEASE_NOTES APK_SHA256 APK_URL
          python3 - <<'PY' > "$ASSET_DIR/latest.json"
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
            'versionCode': int(os.environ['VERSION_CODE']),
            'versionName': os.environ['VERSION_NAME'],
            'minimumSupportedVersionCode': int(os.environ['MINIMUM_SUPPORTED_VERSION_CODE']),
            'mandatory': os.environ['MANDATORY'].lower() == 'true',
            'releaseNotes': [line.strip() for line in os.environ['RELEASE_NOTES'].splitlines() if line.strip()],
            'apkUrl': os.environ['APK_URL'], 'sha256': os.environ['APK_SHA256'],
            'publishedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }, ensure_ascii=False, indent=2))
          PY
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release-assets/

  publish:
    name: Publish Android APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release-assets
      - name: Create Android release and update stable manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
          ASSET_DIR: ${{ runner.temp }}/android-release-assets
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在。" >&2
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$ASSET_DIR"/*.apk "$ASSET_DIR"/*.sha256 "$ASSET_DIR/latest.json" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          if ! gh release view android-latest >/dev/null 2>&1; then gh release create android-latest --target "$GITHUB_SHA" --title "乾坤戒 Android 更新通道" --notes "由 Android 发布工作流自动维护。"; fi
          gh release upload android-latest "$ASSET_DIR/latest.json#latest.json" --clobber
