name: Docker Build and Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送镜像到DockerHub'
        required: true
        default: true
        type: boolean
      image_tag:
        description: '自定义镜像标签（可选，不填则自动生成）'
        required: false
        type: string
      build_platforms:
        description: '构建平台（多平台构建时间约2倍）'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
          - 'linux/arm64'
      branch:
        description: '构建分支'
        required: true
        default: 'main'
        type: choice
        options:
          - 'main'
          - 'master'
          - 'develop'

env:
  DOCKER_IMAGE: storing
  SINGLEFILE_IMAGE: storing-singlefile
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.date.outputs.date }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}

      - name: Extract metadata for SingleFile sidecar
        id: meta-singlefile
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SINGLEFILE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.date.outputs.date }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}

      - name: Build and push main Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}

      - name: Build and push SingleFile sidecar image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/singlefile
          file: ./docker/singlefile/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: ${{ steps.meta-singlefile.outputs.tags }}
          labels: ${{ steps.meta-singlefile.outputs.labels }}
          cache-from: type=gha,scope=singlefile
          cache-to: type=gha,mode=max,scope=singlefile
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') && (github.ref == 'refs/heads/main' || github.event.inputs.branch == 'main')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}
          readme-filepath: ./DOCKER.md
          short-description: '乾坤戒 - AI驱动的个人稍后阅读平台'

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: storing:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test SingleFile sidecar image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/singlefile
          file: ./docker/singlefile/Dockerfile
          push: false
          tags: storing-singlefile:test
          load: true
          cache-from: type=gha,scope=singlefile
          cache-to: type=gha,mode=max,scope=singlefile

      - name: Run container test
        run: |
          docker run -d --name singlefile-test-container \
            -p 13000:3000 \
            storing-singlefile:test

          docker run -d --name test-container \
            -p 1051:1050 -p 1053:1052 \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e AI_PROVIDER="deepseek" \
            -e DEEPSEEK_API_KEY="test-key" \
            -e SINGLEFILE_SERVICE_URL="http://host.docker.internal:13000" \
            --add-host=host.docker.internal:host-gateway \
            storing:test
          
          sleep 10
          
          curl -f http://localhost:1051 || exit 1
          curl -f http://localhost:1053/api/v1/health || exit 1
          curl -f http://localhost:13000/health || exit 1
          
          docker stop test-container
          docker rm test-container
          docker stop singlefile-test-container
          docker rm singlefile-test-container
