name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android versionName，例如 0.7.0"
        required: true
        type: string
      version_code:
        description: "递增的 Android versionCode，例如 7"
        required: true
        type: string
      minimum_supported_version_code:
        description: "最低可继续使用的 versionCode"
        required: true
        type: string
      mandatory:
        description: "是否强制更新"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "更新说明，可输入多行"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ inputs.minimum_supported_version_code }}
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$MINIMUM_SUPPORTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          if (( MINIMUM_SUPPORTED_VERSION_CODE > VERSION_CODE )); then
            echo "minimum_supported_version_code 不能大于 version_code" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore formal signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.QIANKUNJIE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 QIANKUNJIE_RELEASE_KEYSTORE_BASE64 Secret" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qiankunjie-release.jks"
          test -s "$RUNNER_TEMP/qiankunjie-release.jks"

      - name: Build signed Release APK
        env:
          QIANKUNJIE_RELEASE_STORE_FILE: ${{ runner.temp }}/qiankunjie-release.jks
          QIANKUNJIE_RELEASE_STORE_PASSWORD: ${{ secrets.QIANKUNJIE_RELEASE_STORE_PASSWORD }}
          QIANKUNJIE_RELEASE_KEY_ALIAS: ${{ secrets.QIANKUNJIE_RELEASE_KEY_ALIAS }}
          QIANKUNJIE_RELEASE_KEY_PASSWORD: ${{ secrets.QIANKUNJIE_RELEASE_KEY_PASSWORD }}
          QIANKUNJIE_VERSION_NAME: ${{ inputs.version_name }}
          QIANKUNJIE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$QIANKUNJIE_RELEASE_STORE_PASSWORD"
          test -n "$QIANKUNJIE_RELEASE_KEY_ALIAS"
          test -n "$QIANKUNJIE_RELEASE_KEY_PASSWORD"
          pnpm android:assembleRelease

      - name: Verify signing and prepare release assets
        id: assets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ inputs.minimum_supported_version_code }}
          MANDATORY: ${{ inputs.mandatory }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="android-v${VERSION_NAME}"
          SOURCE_APK="apps/android/app/build/outputs/apk/release/乾坤戒-v${VERSION_NAME}-release.apk"
          RELEASE_APK="$RUNNER_TEMP/Qiankunjie-v${VERSION_NAME}-universal-release.apk"
          MANIFEST="$RUNNER_TEMP/latest.json"
          test -f "$SOURCE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SOURCE_APK"
          cp "$SOURCE_APK" "$RELEASE_APK"
          APK_SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Qiankunjie-v${VERSION_NAME}-universal-release.apk"
          export VERSION_NAME VERSION_CODE MINIMUM_SUPPORTED_VERSION_CODE MANDATORY RELEASE_NOTES APK_SHA256 APK_URL MANIFEST
          python3 - <<'PYTHON'
          import json
          import os
          from datetime import datetime, timezone

          notes = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          with open(os.environ["MANIFEST"], "w", encoding="utf-8") as file:
              json.dump({
                  "versionCode": int(os.environ["VERSION_CODE"]),
                  "versionName": os.environ["VERSION_NAME"],
                  "minimumSupportedVersionCode": int(os.environ["MINIMUM_SUPPORTED_VERSION_CODE"]),
                  "mandatory": os.environ["MANDATORY"].lower() == "true",
                  "releaseNotes": notes,
                  "apkUrl": os.environ["APK_URL"],
                  "sha256": os.environ["APK_SHA256"],
                  "publishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              }, file, ensure_ascii=False, indent=2)
          PYTHON
          {
            echo "tag=$TAG"
            echo "apk=$RELEASE_APK"
            echo "manifest=$MANIFEST"
            echo "sha256=$APK_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Create versioned GitHub Release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，拒绝覆盖既有 APK" >&2
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          gh release create "$TAG" \
            "$APK#乾坤戒 v${VERSION_NAME} APK" \
            "$MANIFEST#该版本更新清单" \
            --target "$GITHUB_SHA" \
            --title "乾坤戒 v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE"

      - name: Update stable Android update channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          STABLE_TAG="android-latest"
          if ! gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            gh release create "$STABLE_TAG" \
              --target "$GITHUB_SHA" \
              --title "乾坤戒 Android 更新通道" \
              --notes "由 Release Android APK Workflow 自动维护。"
          fi
          gh release upload "$STABLE_TAG" "$MANIFEST#latest.json" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qiankunjie-v${{ inputs.version_name }}-universal-release
          path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30
