<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <pattern id="paper" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f4efe5"/>
      <path d="M0 18h80M0 55h80M20 0v80M58 0v80" stroke="#8e705133" stroke-width="1"/>
      <circle cx="24" cy="21" r="1.2" fill="#8e705125"/>
      <circle cx="63" cy="47" r=".9" fill="#8e705120"/>
    </pattern>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#66708525" stroke-width="1"/>
    </pattern>
    <pattern id="darkGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#cbd5e120" stroke-width="1"/>
    </pattern>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset=".5" stop-color="#e8edf0"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="1" stop-color="#e9ddc8"/>
    </linearGradient>
    <linearGradient id="paperDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a211b"/>
      <stop offset="1" stop-color="#120f0d"/>
    </linearGradient>
    <linearGradient id="constLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#d9eceb"/>
    </linearGradient>
    <linearGradient id="constDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172326"/>
      <stop offset="1" stop-color="#071112"/>
    </linearGradient>
    <linearGradient id="editLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f4ef"/>
      <stop offset="1" stop-color="#e1e4e2"/>
    </linearGradient>
    <linearGradient id="editDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="1" stop-color="#0c0d10"/>
