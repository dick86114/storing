    <style>
      .title{font-family:"Iowan Old Style","Songti SC",serif;font-size:44px;font-weight:700;fill:#211914}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:20px;fill:#5f5b55}
      .label{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:18px;font-weight:700;letter-spacing:.06em}
      .ui{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .display{font-family:"Iowan Old Style","Songti SC",serif}
      .tiny{font-size:13px}
      .small{font-size:16px}
      .mid{font-size:22px}
      .glassLight{fill:#ffffffb8;stroke:#ffffffcc;stroke-width:1.4}
      .glassDark{fill:#222826b8;stroke:#ffffff22;stroke-width:1.4}
      .lineIcon{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
    </style>
