name: Qiankunjie

options:
  bundleIdPrefix: com.idickies.storing
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: zh-Hans
  minimumXcodeGenVersion: "2.46.0"
  xcodeVersion: "27.0"

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: storing

packages:
  QiankunjieKit:
    path: Packages/QiankunjieKit

targets:
  QiankunjieMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: QiankunjieMac
    dependencies:
      - package: QiankunjieKit
        product: QiankunjieKit
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: storing
        INFOPLIST_KEY_CFBundleName: storing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.idickies.storing.macos
        PRODUCT_MODULE_NAME: QiankunjieMac

  QiankunjieMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: QiankunjieMacTests
    dependencies:
      - target: QiankunjieMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.idickies.storing.macos.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/storing.app/Contents/MacOS/storing"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  QiankunjieMac:
    build:
      targets:
        QiankunjieMac: all
        QiankunjieMacTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - QiankunjieMacTests
