version: '3.8'

services:
  storing-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: storing:dev
    container_name: storing-dev
    restart: unless-stopped
    ports:
      - "1051:1050"  # 前端
      - "1053:1052"  # API
    environment:
      # 数据库连接
      - DATABASE_URL=${DATABASE_URL}

      # AI 配置
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - AI_MODEL=${AI_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CUSTOM_AI_BASE_URL=${CUSTOM_AI_BASE_URL}
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY}
      - CUSTOM_AI_MODEL=${CUSTOM_AI_MODEL}

      # 文章抓取服务
      - READER_API_BASE=${READER_API_BASE}
      - SINGLEFILE_SERVICE_URL=${SINGLEFILE_SERVICE_URL:-http://singlefile-dev:3000}
      - SINGLEFILE_TIMEOUT_MS=${SINGLEFILE_TIMEOUT_MS:-180000}
      - SINGLEFILE_MAX_BUFFER=${SINGLEFILE_MAX_BUFFER:-83886080}

      # 图片上传服务
      - IMG_HOST=${IMG_HOST}
      - IMG_API_KEY=${IMG_API_KEY}

      # 运行时配置
      - NODE_ENV=development
    volumes:
      # 开发模式：挂载源码，支持实时更新
      - ./apps/api/src:/app/apps/api/src
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
      # 持久化日志
      - ./logs:/app/logs
    depends_on:
      - singlefile-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1052/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  singlefile-dev:
    build:
      context: ./docker/singlefile
      dockerfile: Dockerfile
    image: storing-singlefile:dev
    container_name: storing-singlefile-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SINGLEFILE_TIMEOUT_MS=${SINGLEFILE_TIMEOUT_MS:-180000}
      - SINGLEFILE_MAX_BUFFER=${SINGLEFILE_MAX_BUFFER:-83886080}
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
